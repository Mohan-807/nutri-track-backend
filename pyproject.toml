[project]
name = "nutri-tracker-backend"
version = "0.1.0"
description = "Nutri Tracker backend API (FastAPI + PostgreSQL)"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "alembic",
  "pydantic[email]>=2",
  "pydantic-settings",
  "passlib[argon2]",
  "pyjwt",
]

[dependency-groups]
dev = [
  "pytest",
  "httpx",
  "pytest-cov",
  "ruff",
]

[project.scripts]
seed-foods = "scripts.seed_foods:main"

[tool.ruff]
line-length = 110

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "scripts"]
